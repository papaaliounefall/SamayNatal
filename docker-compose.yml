services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: samay_natal
      POSTGRES_USER: samay_natal
      POSTGRES_PASSWORD: samay_natal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samay_natal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Host-side only — 9000/9001 are already taken by another project's
      # MinIO container on this machine. Internal container-to-container
      # traffic still uses "minio:9000" (the S3_ENDPOINT below), unaffected.
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://samay_natal:samay_natal@db:5432/samay_natal
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "True"
      USE_LOCAL_FILE_STORAGE: "False"
      S3_ENDPOINT: http://minio:9000
      # Signed URLs are handed to the browser, which can't resolve the
      # internal Docker hostname "minio" — sign them for the mapped host
      # port instead (see apps/photos/storage.py).
      S3_PUBLIC_ENDPOINT: http://localhost:9010
    volumes:
      - ./backend:/app
    ports:
      # Host-side only — 8000 is already taken by another project on this
      # machine. Gunicorn/runserver still listens on 8000 inside the
      # container; only the host mapping moves.
      - "8010:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  celery:
    build: ./backend
    command: celery -A config worker --loglevel=info
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://samay_natal:samay_natal@db:5432/samay_natal
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "True"
      USE_LOCAL_FILE_STORAGE: "False"
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./backend:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  celery-beat:
    build: ./backend
    command: celery -A config beat --loglevel=info
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://samay_natal:samay_natal@db:5432/samay_natal
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "True"
    volumes:
      - ./backend:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8010

volumes:
  postgres_data:
  minio_data:
